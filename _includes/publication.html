<article class="research-row">
  <div class="year">{{ include.pub.year }}<br>{{ include.pub.venue_short }}</div>
  <div>
    <h3>{{ include.pub.title | escape }}</h3>
    <p class="authors">{{ include.pub.authors | escape }}</p>
    <div class="pub-summary">{{ include.pub.content | markdownify }}</div>
    <div class="row-links">
      <a href="{{ include.pub.paper }}">paper ↗</a>
      {% if include.pub.publisher %}<a href="{{ include.pub.publisher }}">publisher ↗</a>{% endif %}
      {% if include.pub.code %}<a href="{{ include.pub.code }}">code ↗</a>{% endif %}
    </div>
  </div>
</article>
