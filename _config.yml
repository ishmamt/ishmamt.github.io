title: Ishmam Tashdeed
description: Research, writing, and a little life outside the lab.
url: https://ishmamt.github.io
baseurl: ""
timezone: Asia/Dhaka
lang: en
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:title/

collections:
  publications:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - PORTFOLIO_OVERHAUL_SPEC.md
  - PORTFOLIO_LAYOUT_MOCKUP.html
  - IMPLEMENTATION_PLAN.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
